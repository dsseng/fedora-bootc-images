name: Build a ContainerDisk

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: bootc
        run: |
          # doesn't need rootful, but running as root for sharing the images with the builder
          sudo podman build -f Containerfile.os -t localhost/bootc-vm:latest .

      - name: bootc-install
        run: |
          mkdir -p output/qcow2
          truncate -s 8G output/disk.img

          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            --pid=host \
            -v /dev:/dev \
            -v ${{ github.workspace }}/output:/output \
            localhost/bootc-vm:latest \
            bootc install to-disk \
              --via-loopback \
              --generic-image \
              --composefs-backend \
              --bootloader=systemd \
              --filesystem=ext4 \
              --wipe \
              /output/disk.img
          sudo chown $USER:$USER output/disk.img
          ls -lh output/disk.img

      - name: qcow2
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils
          qemu-img convert -f raw -O qcow2 -c \
            -o compression_type=zstd,cluster_size=2M \
            output/disk.img output/qcow2/disk.qcow2
          qemu-img info output/qcow2/disk.qcow2
          chmod 0644 output/qcow2/disk.qcow2
          ls -lh output/disk.img output/qcow2/disk.qcow2

      - name: Push ContainerDisk
        run: |
          IMAGE_TAG=${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
          LATEST_TAG=${{ env.REGISTRY }}/${{ github.repository }}:latest

          podman build -f Containerfile.disk -t $IMAGE_TAG .
          podman push $IMAGE_TAG

          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            podman tag $IMAGE_TAG $LATEST_TAG
            podman push $LATEST_TAG
          fi
